[package]
name = "vantax-cli"
description = "The vantax command: ML-DSA-87 keys and signatures, PQ commitments, transaction intents, Shamir vaults, and a client for the Vantax quantum-risk scanner with CI exit codes."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["post-quantum", "cli", "ml-dsa", "scanner", "shamir"]
categories = ["cryptography", "command-line-utilities"]

[[bin]]
name = "vantax"
path = "src/main.rs"

[dependencies]
vantax-core.workspace = true
vantax-adapters.workspace = true
vantax-scan-common.workspace = true
vantax-fairness = { workspace = true, features = ["signatures"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
zeroize.workspace = true
aes-gcm.workspace = true
rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
# The integration tests run a stand-in for the Vantax API in-process for
# `vantax scan` and `vantax account` (same routes, status codes and JSON).
axum.workspace = true
tokio.workspace = true
