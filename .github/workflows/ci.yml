name: Vantax CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Tests without legacy Dilithium5 support
        run: cargo test -p vantax-core --no-default-features

      - name: Fairness verifier without signatures (no C dependencies)
        run: |
          cargo test -p vantax-fairness --no-default-features
          cargo clippy -p vantax-fairness --no-default-features --all-targets -- -D warnings

      - name: Fairness vectors are current and match the Python verifier
        run: |
          cargo run -q -p vantax-fairness --example vectors | diff - docs/fairness/vectors.json
          python3 docs/fairness/verify_fairness.py --vectors docs/fairness/vectors.json

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Dependency audit (RustSec)
        run: cargo audit

  wasm:
    name: Browser build (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build vantax_wasm.wasm
        run: cargo build -p vantax-wasm --release --target wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript loader tests
        run: node --test crates/vantax-wasm/js/vantax.test.mjs

      - name: Smoke test the real module from Node
        run: node crates/vantax-wasm/js/smoke.mjs target/wasm32-unknown-unknown/release/vantax_wasm.wasm

      # The site's verifier page (site/verify.html) ships a copy of both files.
      - name: The site's copy is current and passes too
        run: |
          diff crates/vantax-wasm/js/vantax.js site/wasm/vantax.js
          node crates/vantax-wasm/js/smoke.mjs site/wasm/vantax_wasm.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: vantax-wasm
          path: |
            target/wasm32-unknown-unknown/release/vantax_wasm.wasm
            crates/vantax-wasm/js/vantax.js

  falcon:
    name: Falcon-512 (browser build, KAT, interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build falcon512.wasm and the known-answer-test build
        run: ./falcon/build.sh kat

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Native Falcon-512 tests (write the native interop vector)
        run: cargo test -p vantax-core falcon

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NIST KAT, round trips, interop with the native build
        run: node --test falcon/js/falcon.test.mjs

      # The site ships a copy of the loader and the module.
      - name: The site's copy is current and passes too
        run: |
          diff falcon/js/falcon.js site/wasm/falcon.js
          FALCON_WASM=site/wasm/falcon512.wasm node --test falcon/js/falcon.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: falcon512-wasm
          path: |
            falcon/dist/falcon512.wasm
            falcon/js/falcon.js
